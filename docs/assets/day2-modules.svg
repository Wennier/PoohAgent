<rect x="40" y="910" width="1160" height="168" rx="14" fill="#F6F8FB" stroke="#DDE5F0" stroke-width="1.2"/>
<text x="64" y="944" font-size="14" font-weight="600" fill="#5F6368">这一天的设计意图（为什么这样切）</text>
<circle cx="74" cy="976" r="11" fill="#1F3B63"/>
<text x="74" y="980" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="94" y="980" font-size="13.5" font-weight="600" fill="#1F2328">归约是"重组"不是过滤</text>
<text x="94" y="1004" font-size="12.5" fill="#4B5563">协议是扁平 role 列表，UI 要按轮合并；</text>
<text x="94" y="1024" font-size="12.5" fill="#4B5563">同一份数据两种形态必须收敛。</text>
<circle cx="454" cy="976" r="11" fill="#1F3B63"/>
<text x="454" y="980" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="474" y="980" font-size="13.5" font-weight="600" fill="#1F2328">两条入口一个出口</text>
<text x="474" y="1004" font-size="12.5" fill="#4B5563">直播只能增量、快照只能全量；</text>
<text x="474" y="1024" font-size="12.5" fill="#4B5563">用"两路径等价"的不变量锁住。</text>
<circle cx="834" cy="976" r="11" fill="#1F3B63"/>
<text x="834" y="980" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="854" y="980" font-size="13.5" font-weight="600" fill="#1F2328">状态只属于 controller</text>
<text x="854" y="1004" font-size="12.5" fill="#4B5563">状态机要同步读，生命周期比组件长；</text>
<text x="854" y="1024" font-size="12.5" fill="#4B5563">归约层与视图层只读不写。</text>
</svg>