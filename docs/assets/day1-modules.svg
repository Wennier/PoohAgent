<text x="690" y="306" font-size="14.5" font-weight="600" fill="#1F2328">fetch 拿流</text>
<text x="690" y="326" font-size="12" fill="#6B7280">POST → ReadableStream&lt;Uint8Array&gt;，边界任意</text>
<path d="M 666 342 L 666 360" stroke="#1A56B3" stroke-width="1.4" stroke-dasharray="4 4" fill="none" marker-end="url(#arrowBlue)"/>
