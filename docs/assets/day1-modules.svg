  <rect width="1240" height="828" fill="#FFFFFF"/>
<text x="40" y="52" font-size="25" font-weight="700" fill="#1F2328">Day 1 · 协议打通：把字节流变成事件</text>
<text x="1200" y="52" font-size="13" fill="#8A8F98" text-anchor="end">5 个代码模块 + 1 个外部夹具 · 32 条单测 · 目标：看见一条完整事件序列</text>
<text x="40" y="96" font-size="14" font-weight="600" fill="#5F6368">模块与依赖　箭头 = 谁依赖谁（指向被依赖方）</text>
<text x="640" y="96" font-size="14" font-weight="600" fill="#5F6368">数据流　编号 = 数据经过的顺序</text>
