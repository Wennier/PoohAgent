<text x="690" y="388" font-size="14.5" font-weight="600" fill="#1F2328">字节 → 帧</text>
<text x="690" y="408" font-size="12" fill="#6B7280">TextDecoder(stream:true) + 空行分隔 + 保留残片</text>
<path d="M 666 424 L 666 442" stroke="#1A56B3" stroke-width="1.4" stroke-dasharray="4 4" fill="none" marker-end="url(#arrowBlue)"/>
<rect x="640" y="444" width="560" height="62" rx="10" fill="#F7FAFF" stroke="#D6E2F3" stroke-width="1.2" stroke-dasharray="5 4"/>
<circle cx="666" cy="475" r="13" fill="#1A56B3"/>
<text x="666" y="480" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="690" y="470" font-size="14.5" font-weight="600" fill="#1F2328">帧 → 事件</text>
<text x="690" y="490" font-size="12" fill="#6B7280">JSON.parse 容错，未知 type 原样透传</text>
<path d="M 666 506 L 666 524" stroke="#1A56B3" stroke-width="1.4" stroke-dasharray="4 4" fill="none" marker-end="url(#arrowBlue)"/>
<rect x="640" y="526" width="560" height="62" rx="10" fill="#F7FAFF" stroke="#D6E2F3" stroke-width="1.2" stroke-dasharray="5 4"/>
<circle cx="666" cy="557" r="13" fill="#1A56B3"/>
<text x="666" y="562" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="690" y="552" font-size="14.5" font-weight="600" fill="#1F2328">事件 → 日志</text>
<text x="690" y="572" font-size="12" fill="#6B7280">Observable&lt;AgentEvent&gt;，中止走 error 回调</text>
<rect x="40" y="616" width="1160" height="168" rx="14" fill="#F6F8FB" stroke="#DDE5F0" stroke-width="1.2"/>
<text x="64" y="650" font-size="14" font-weight="600" fill="#5F6368">这一天的设计意图（为什么这样切）</text>
<circle cx="74" cy="682" r="11" fill="#1F3B63"/>
<text x="74" y="686" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="94" y="686" font-size="13.5" font-weight="600" fill="#1F2328">解析拆成三层</text>
<text x="94" y="710" font-size="12.5" fill="#4B5563">字节 / 帧 / JSON 的"出错单位"不同，</text>
<text x="94" y="730" font-size="12.5" fill="#4B5563">分开后能立刻定位是哪一层错。</text>
<circle cx="454" cy="682" r="11" fill="#1F3B63"/>
<text x="454" y="686" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="474" y="686" font-size="13.5" font-weight="600" fill="#1F2328">纯函数 + 生成器</text>
<text x="474" y="710" font-size="12.5" fill="#4B5563">splitFrames 是纯函数 → 分片 / 粘包 /</text>
<text x="474" y="730" font-size="12.5" fill="#4B5563">UTF-8 截断五种切法都能单测。</text>
<circle cx="834" cy="682" r="11" fill="#1F3B63"/>
<text x="834" y="686" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="854" y="686" font-size="13.5" font-weight="600" fill="#1F2328">只有 gateway 知道协议</text>
<text x="854" y="710" font-size="12.5" fill="#4B5563">URL / Header / 请求体形状只在这里，</text>
<text x="854" y="730" font-size="12.5" fill="#4B5563">换后端只改一处。</text>
