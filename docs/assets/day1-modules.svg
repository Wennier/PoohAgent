<text x="690" y="162" font-size="12" fill="#6B7280">connectAgentStream({ threadId, messages, channel, signal })</text>
<path d="M 666 178 L 666 196" stroke="#1A56B3" stroke-width="1.4" stroke-dasharray="4 4" fill="none" marker-end="url(#arrowBlue)"/>
