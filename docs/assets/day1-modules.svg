<text x="60" y="280" font-size="17" font-weight="600" fill="#1F2328">transport/agent-gateway</text>
<text x="60" y="308" font-size="12.5" fill="#6B7280">buildChatBody 组装请求体 · connectAgentStream 编排</text>
