<text x="690" y="244" font-size="12" fill="#6B7280">thread_id 空串 / contexts[0].params 是 JSON 字符串</text>
<path d="M 666 260 L 666 278" stroke="#1A56B3" stroke-width="1.4" stroke-dasharray="4 4" fill="none" marker-end="url(#arrowBlue)"/>
<rect x="640" y="280" width="560" height="62" rx="10" fill="#F7FAFF" stroke="#D6E2F3" stroke-width="1.2" stroke-dasharray="5 4"/>
